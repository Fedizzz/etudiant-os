# Applique les migrations SQL (supabase/migrations) au projet Supabase de production. Lancement MANUEL uniquement.
# Secrets requis (Settings → Secrets → Actions) : SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD ; variable : SUPABASE_PROJECT_REF.
name: Migrations Supabase
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Tapez APPLIQUER pour appliquer les migrations en production"
        required: true
jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'APPLIQUER' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.45.5 }
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --dry-run
      - run: supabase db push
