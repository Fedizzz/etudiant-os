<script>
  window.__INITIAL_HASH__ = location.hash;
  // Thème appliqué avant le premier rendu (évite un flash clair en mode sombre).
  try { var t = JSON.parse(localStorage.getItem("etudiant-os/theme") || "null"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  // Thème sombre du système : attribut data-night (styles du mode « carnet de nuit »), suivi en direct.
  // Couleur de la barre d'état / barre d'adresse = fond de l'app, aussi quand le thème est forcé dans les réglages.
  try { var syncBar = function () { var bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim().split(/\s+/).join(","); if (bg) document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", "rgb(" + bg + ")"); m.removeAttribute("media"); }); };
    new MutationObserver(syncBar).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "data-night"] }); document.addEventListener("DOMContentLoaded", syncBar); } catch (e) {}
  try { var mq = matchMedia("(prefers-color-scheme: dark)"), night = function () { document.documentElement.toggleAttribute("data-night", mq.matches); }; night(); mq.addEventListener("change", night); } catch (e) {}
</script>
